name: 🖥️ RDP + Tailscale + 飞书通知

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *" # 每 5 小时自动运行一次

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 🛠️ 配置远程桌面
        run: |
          # 启用远程桌面并关闭网络级认证
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          # 删除旧防火墙规则，重新开放 3389 端口
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # 重启远程桌面服务
          Restart-Service -Name TermService -Force

      - name: 👤 创建 RDP 用户
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "✅ RDP 用户创建成功！"

      - name: 🌐 安装 Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "✅ Tailscale 安装完成！"

      - name: 🔐 启动 Tailscale 并检测授权
        id: tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY -or $env:TAILSCALE_AUTH_KEY.Trim() -eq "") {
            Write-Host "❌ 未配置 TAILSCALE_AUTH_KEY，无法自动登录 Tailscale！"
            exit 1
          }

          Write-Host "⚙️ 正在启动 Tailscale..."
          $output = & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID 2>&1
          Write-Host $output

          if ($output -match "https://login.tailscale.com/a/[A-Za-z0-9-]+") {
            $authUrl = $matches[0]
            Write-Host "⚠️ Tailscale 需要手动登录授权: $authUrl"

            try {
              $tokenBody = @{ app_id = $env:FEISHU_APP_ID; app_secret = $env:FEISHU_APP_SECRET } | ConvertTo-Json
              $tokenResp = Invoke-RestMethod -Uri "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal/" -Method POST -Body $tokenBody -ContentType "application/json"
              $tenantToken = $tokenResp.tenant_access_token

              $contentJson = @{ text = "⚠️ Tailscale 需要在浏览器手动授权：`n$authUrl" } | ConvertTo-Json -Depth 1
              $payload = @{
                  receive_id_type = "user_id"
                  receive_id      = $env:FEISHU_USER_ID
                  content         = $contentJson
                  msg_type        = "text"
              } | ConvertTo-Json -Depth 3

              Invoke-RestMethod -Uri "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=user_id" `
                -Headers @{ Authorization = "Bearer $tenantToken" } `
                -Method POST -Body $payload -ContentType "application/json"

              Write-Host "📨 飞书通知已发送，请在浏览器完成 Tailscale 授权。"
            } catch {
              Write-Host "❌ 飞书通知发送失败: $($_.Exception.Message)"
            }

            exit 1
          }

          Write-Host "✅ Tailscale 自动认证成功！"

      - name: 🧭 获取 Tailscale IP
        shell: pwsh
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "🌐 Tailscale IP: $tsIP"

      - name: 📤 飞书发送 RDP 登录信息
        shell: pwsh
        run: |
          $rdpMsg = "✅ Windows RDP 已启动：`nIP: $env:TAILSCALE_IP`n用户名: RDP`n密码: $env:RDP_PASSWORD"

          $contentJson = @{ text = $rdpMsg } | ConvertTo-Json -Depth 1
          $payload = @{
              receive_id_type = "user_id"
              receive_id      = $env:FEISHU_USER_ID
              content         = $contentJson
              msg_type        = "text"
          } | ConvertTo-Json -Depth 3

          $tokenBody = @{ app_id = $env:FEISHU_APP_ID; app_secret = $env:FEISHU_APP_SECRET } | ConvertTo-Json
          $tokenResp = Invoke-RestMethod -Uri "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal/" -Method POST -Body $tokenBody -ContentType "application/json"
          $tenantToken = $tokenResp.tenant_access_token

          Invoke-RestMethod -Uri "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=user_id" `
            -Headers @{ Authorization = "Bearer $tenantToken" } `
            -Method POST -Body $payload -ContentType "application/json"
          Write-Host "📨 RDP 登录信息已通过飞书发送。"

      - name: ⏳ 保持会话活跃
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "🖥️ [$((Get-Date).ToString('HH:mm:ss'))] RDP 会话活跃中，使用 Ctrl+C 终止。"
            Start-Sleep -Seconds 300
          }
